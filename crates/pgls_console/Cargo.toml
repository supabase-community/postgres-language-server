[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_console"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_markup    = { workspace = true }
pgls_text_size = { workspace = true }

schemars             = { workspace = true, optional = true }
serde                = { workspace = true, optional = true, features = ["derive"] }
termcolor            = { workspace = true }
unicode-segmentation = "1.12.0"
unicode-width        = { workspace = true }

[dev-dependencies]
trybuild = "1.0.99"

[features]
schema = ["dep:schemars", "pgls_text_size/schema"]
serde  = ["dep:serde"]

[lib]
doctest = false

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet

[package.metadata.cargo-shear]
# Compile-fail cases that `tests/macro.rs` hands to trybuild, not modules.
ignored-paths = ["tests/markup/*.rs"]
