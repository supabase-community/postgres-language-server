[package]
authors.workspace    = true
categories.workspace = true
description          = "WASM bindings for the Postgres Language Server"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_wasm"
repository.workspace = true
version              = "0.0.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
pgls_analyse       = { workspace = true }
pgls_completions   = { workspace = true }
pgls_configuration = { workspace = true }
pgls_diagnostics   = { workspace = true }
pgls_fs            = { workspace = true, features = ["serde"] }
pgls_line_index    = { workspace = true }
pgls_query         = { workspace = true }
pgls_text_size     = { workspace = true }
pgls_workspace     = { path = "../pgls_workspace", default-features = false }

lsp-types  = "0.97"
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "warn"
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
