[package]
authors.workspace    = true
categories.workspace = true
description          = "What the language server knows about migration tools: their projects, files and markers"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_migrations"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_diagnostics = { workspace = true }
pgls_fs          = { workspace = true, features = ["serde"] }
pgls_lexer       = { workspace = true }
pgls_text_size   = { workspace = true }
schemars         = { workspace = true, optional = true }
serde            = { workspace = true, features = ["derive"] }
toml             = { workspace = true }

[dev-dependencies]
pgls_statement_splitter = { workspace = true }
tempfile                = "3.15.0"

[lib]
doctest = false

[features]
schema = ["dep:schemars"]

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
