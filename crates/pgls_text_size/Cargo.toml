[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_text_size"
repository.workspace = true
version              = "0.0.0"

[dependencies]
schemars = { workspace = true, optional = true }
serde    = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]
serde  = ["dep:serde"]

[dev-dependencies]
serde_test        = "1.0"
static_assertions = "1.1"

[[test]]
name              = "serde"
path              = "tests/serde.rs"
required-features = ["serde"]

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "warn"
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
