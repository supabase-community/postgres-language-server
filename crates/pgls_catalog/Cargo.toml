[package]
authors.workspace    = true
categories.workspace = true
description          = "The database catalog: a snapshot of the database and the changes of the current file"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_catalog"
repository.workspace = true
version              = "0.0.0"

[features]
# Load the snapshot from a database connection. Disable for WASM builds.
db = ["dep:sqlx", "dep:futures-util"]
# Derive JSON schemas for the snapshot types, used by codegen.
schema = ["dep:schemars"]

[dependencies]
futures-util   = { version = "0.3.31", optional = true }
globset        = "0.4.16"
pgls_lexer     = { workspace = true }
pgls_query     = { workspace = true }
pgls_query_ext = { workspace = true }
rustc-hash     = { workspace = true }
schemars       = { workspace = true, optional = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
sqlx           = { workspace = true, optional = true }
strum          = { workspace = true }

[dev-dependencies]
insta           = { workspace = true }
pgls_test_utils = { workspace = true }

[lib]
doctest = false

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
