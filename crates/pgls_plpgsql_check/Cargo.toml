[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_plpgsql_check"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_catalog     = { workspace = true, features = ["db"] }
pgls_console     = { workspace = true }
pgls_diagnostics = { workspace = true }
pgls_line_index  = { workspace = true }
pgls_query       = { workspace = true }
pgls_query_ext   = { workspace = true }
pgls_text_size   = { workspace = true }
regex            = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sqlx             = { workspace = true }

[dev-dependencies]
pgls_test_utils = { workspace = true }

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "warn"
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "warn"
