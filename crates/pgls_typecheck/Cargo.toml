[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_typecheck"
repository.workspace = true
version              = "0.0.0"


[dependencies]
itertools                         = { version = "0.14.0" }
once_cell                         = "1.20.2"
pgls_catalog                      = { workspace = true, features = ["db"] }
pgls_console.workspace            = true
pgls_diagnostics.workspace        = true
pgls_line_index.workspace         = true
pgls_query.workspace              = true
pgls_text_size.workspace          = true
pgls_treesitter.workspace         = true
pgls_treesitter_grammar.workspace = true
regex                             = "1.11.1"
sqlx.workspace                    = true
tree-sitter.workspace             = true

[dev-dependencies]
criterion.workspace       = true
insta.workspace           = true
pgls_test_utils.workspace = true

[[bench]]
harness = false
name    = "error_rewriting"

[lib]
doctest = false

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "warn"
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "warn"
