[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_completions"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_catalog              = { workspace = true }
pgls_migrations           = { workspace = true }
pgls_text_size            = { workspace = true, features = ["serde"] }
pgls_treesitter.workspace = true

fuzzy-matcher                     = "0.3.7"
pgls_treesitter_grammar.workspace = true
schemars                          = { workspace = true, optional = true }
serde                             = { workspace = true, features = ["derive"] }
tracing                           = { workspace = true }
tree-sitter.workspace             = true

[dev-dependencies]
criterion.workspace       = true
insta.workspace           = true
pgls_catalog              = { workspace = true, features = ["db"] }
pgls_test_utils.workspace = true
regex                     = "1.12.2"
sqlx.workspace            = true
unindent                  = "0.2.4"


[lib]
doctest = false

[features]
schema = ["dep:schemars", "pgls_text_size/schema"]

[[bench]]
harness = false
name    = "sanitization"

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
