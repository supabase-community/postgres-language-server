[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_fs"
repository.workspace = true
version              = "0.0.0"


[dependencies]
crossbeam        = { workspace = true }
directories      = "5.0.1"
enumflags2       = { workspace = true }
ignore           = { workspace = true }
oxc_resolver     = { workspace = true }
parking_lot      = { version = "0.12.3", features = ["arc_lock"] }
pgls_diagnostics = { workspace = true }
rayon            = { workspace = true }
rustc-hash       = { workspace = true }
schemars         = { workspace = true, optional = true }
serde            = { workspace = true, optional = true }
smallvec         = { workspace = true }
tracing          = { workspace = true }

[dev-dependencies]
tempfile = "3.15.0"

[features]
schema = ["dep:schemars", "pgls_diagnostics/schema"]
serde  = ["dep:serde"]

[lib]
doctest = false

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "warn"
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "warn"
