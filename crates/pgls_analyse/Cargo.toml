
[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_analyse"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_console.workspace     = true
pgls_diagnostics.workspace = true

enumflags2.workspace = true
schemars             = { workspace = true, optional = true }
serde                = { workspace = true, features = ["derive"], optional = true }

[features]
schema = ["dep:schemars"]
serde  = ["dep:serde"]

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "warn"
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "warn"
