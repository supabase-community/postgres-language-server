
[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_analyser"
repository.workspace = true
version              = "0.0.0"

[dependencies]
pgls_analyse     = { workspace = true }
pgls_catalog     = { workspace = true }
pgls_console     = { workspace = true }
pgls_diagnostics = { workspace = true }
pgls_lexer       = { workspace = true }
pgls_query       = { workspace = true }
pgls_query_ext   = { workspace = true }
pgls_resolve     = { workspace = true }
pgls_text_size   = { workspace = true }
pgls_walk        = { workspace = true }
rustc-hash       = { workspace = true }
schemars         = { workspace = true }
serde            = { workspace = true }

[dev-dependencies]
insta                   = { version = "1.42.1" }
pgls_catalog            = { workspace = true, features = ["db"] }
pgls_diagnostics        = { workspace = true }
pgls_migrations         = { workspace = true }
pgls_postgres_regress   = { workspace = true }
pgls_statement_splitter = { workspace = true }
pgls_test_macros        = { workspace = true }
pgls_test_utils         = { workspace = true }
rayon                   = { workspace = true }
serde_json              = { workspace = true }
sqlx                    = { workspace = true }
termcolor               = { workspace = true }
tokio                   = { workspace = true }

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
