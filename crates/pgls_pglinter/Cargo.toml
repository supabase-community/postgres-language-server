[package]
authors.workspace    = true
categories.workspace = true
description          = "pglinter Postgres extension integration for database linting"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_pglinter"
repository.workspace = true
version              = "0.0.0"

[dependencies]
pgls_analyse.workspace     = true
pgls_catalog               = { workspace = true }
pgls_diagnostics.workspace = true
rustc-hash.workspace       = true
serde.workspace            = true
sqlx.workspace             = true

[dev-dependencies]
insta.workspace           = true
pgls_catalog              = { workspace = true, features = ["db"] }
pgls_console.workspace    = true
pgls_test_utils.workspace = true

[build-dependencies]
ureq = "2.9"

[lib]
doctest = false

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "warn"
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
