[package]
authors.workspace    = true
categories.workspace = true
description          = "Postgres regression SQL with Postgres' verdict per statement, for every supported major version"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_postgres_regress"
repository.workspace = true
version              = "0.0.0"


[dependencies]
flate2.workspace                  = true
pgls_statement_splitter.workspace = true
pgls_text_size.workspace          = true

pgls_catalog = { workspace = true, features = ["db"], optional = true }
serde_json   = { workspace = true, optional = true }
sqlx         = { workspace = true, optional = true }
tokio        = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace      = true
pgls_query.workspace = true

[features]
# Dependencies of the recorder, which needs Docker and the network.
record = ["dep:pgls_catalog", "dep:serde_json", "dep:sqlx", "dep:tokio"]

[[bin]]
name              = "record"
required-features = ["record"]

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "allow" # test infrastructure, which fails on unexpected data
indexing_slicing                = "allow" # test infrastructure, which fails on unexpected data
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # test infrastructure, which fails on unexpected data
