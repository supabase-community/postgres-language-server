[package]
authors.workspace    = true
categories.workspace = true
description          = "Postgres regression SQL with Postgres' verdict per statement, for every supported major version"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_postgres_regress"
repository.workspace = true
version              = "0.0.0"


[dependencies]
flate2.workspace                  = true
pgls_statement_splitter.workspace = true
pgls_text_size.workspace          = true

pgls_catalog = { workspace = true, features = ["db"], optional = true }
serde_json   = { workspace = true, optional = true }
sqlx         = { workspace = true, optional = true }
tokio        = { workspace = true, optional = true }

[features]
# Dependencies of the recorder, which needs Docker and the network.
record = ["dep:pgls_catalog", "dep:serde_json", "dep:sqlx", "dep:tokio"]

[[bin]]
name              = "record"
required-features = ["record"]
