[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_statement_splitter"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_diagnostics         = { workspace = true }
pgls_lexer.workspace     = true
pgls_query.workspace     = true
pgls_text_size.workspace = true

[dev-dependencies]
criterion.workspace = true
ntest               = "0.9.3"

[[bench]]
harness = false
name    = "splitter"

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
