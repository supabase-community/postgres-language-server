[package]
authors.workspace    = true
categories.workspace = true
description          = "Proc macros for pgls_configuration (Merge, Partial derives)"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_configuration_macros"
repository.workspace = true
version              = "0.0.0"

[lib]
proc-macro = true

[dependencies]
proc-macro-error = { version = "1.0.4", default-features = false }
proc-macro2      = { workspace = true }
quote            = { workspace = true }
syn              = { workspace = true, features = ["extra-traits"] }

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # a proc macro runs on our own code at build time
indexing_slicing                = "allow" # a proc macro runs on our own code at build time
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # a proc macro runs on our own code at build time
