[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_pretty_print"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_pretty_print_codegen.workspace = true
pgls_query.workspace                = true
thiserror.workspace                 = true

[dev-dependencies]
camino.workspace                  = true
dir-test.workspace                = true
insta.workspace                   = true
pgls_postgres_regress.workspace   = true
pgls_statement_splitter.workspace = true
rayon.workspace                   = true
regex.workspace                   = true

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "warn"
