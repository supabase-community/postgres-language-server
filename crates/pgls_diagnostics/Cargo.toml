[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_diagnostics"
repository.workspace = true
version              = "0.0.0"


[dependencies]
backtrace                   = "0.3.74"
bpaf                        = { workspace = true }
enumflags2                  = { workspace = true }
oxc_resolver                = { workspace = true }
pgls_console                = { workspace = true, features = ["serde"] }
pgls_diagnostics_categories = { workspace = true, features = ["serde"] }
pgls_diagnostics_macros     = { workspace = true }
pgls_line_index             = { workspace = true }
pgls_text_edit              = { workspace = true, features = ["serde"] }
pgls_text_size.workspace    = true
schemars                    = { workspace = true, optional = true }
serde                       = { workspace = true, features = ["derive"] }
serde_json                  = { workspace = true }
termcolor                   = { workspace = true }
unicode-width               = { workspace = true }

[features]
schema = ["dep:schemars", "pgls_text_edit/schema", "pgls_diagnostics_categories/schema", "pgls_console/schema"]

[dev-dependencies]

[lib]
doctest = false

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
