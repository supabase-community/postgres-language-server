[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_lsp"
repository.workspace = true
version              = "0.0.0"


[dependencies]
anyhow                   = { workspace = true }
futures                  = "0.3.31"
parking_lot              = "0.12.3"
pgls_analyse             = { workspace = true }
pgls_completions         = { workspace = true }
pgls_configuration       = { workspace = true }
pgls_diagnostics         = { workspace = true }
pgls_fs                  = { workspace = true }
pgls_line_index          = { workspace = true }
pgls_text_edit           = { workspace = true }
pgls_text_size.workspace = true
pgls_workspace           = { workspace = true }
rustc-hash               = { workspace = true }
serde                    = { workspace = true, features = ["derive"] }
serde_json               = { workspace = true }
strum                    = { workspace = true }
tokio                    = { workspace = true, features = ["rt", "io-std", "sync"] }
tower-lsp-server         = { version = "0.23.0" }
tracing                  = { workspace = true, features = ["attributes"] }

[dev-dependencies]
pgls_test_utils = { workspace = true }
sqlx            = { workspace = true }
tempfile        = "3.15.0"
tokio           = { workspace = true, features = ["macros"] }
tower           = { version = "0.5.3", features = ["timeout", "util"] }

[lib]
doctest = false

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "warn"
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "warn"
