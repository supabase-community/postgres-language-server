[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_lsp"
repository.workspace = true
version              = "0.0.0"


[dependencies]
anyhow                   = { workspace = true }
futures                  = "0.3.31"
parking_lot              = "0.12.3"
pgls_analyse             = { workspace = true }
pgls_completions         = { workspace = true }
pgls_configuration       = { workspace = true }
pgls_diagnostics         = { workspace = true }
pgls_fs                  = { workspace = true }
pgls_line_index          = { workspace = true }
pgls_text_edit           = { workspace = true }
pgls_text_size.workspace = true
pgls_workspace           = { workspace = true }
rustc-hash               = { workspace = true }
serde                    = { workspace = true, features = ["derive"] }
serde_json               = { workspace = true }
strum                    = { workspace = true }
tokio                    = { workspace = true, features = ["rt", "io-std", "sync"] }
tower                    = { version = "0.5.3", features = ["timeout", "util"], optional = true }
tower-lsp-server         = { version = "0.23.0" }
tracing                  = { workspace = true, features = ["attributes"] }

[features]
# The client of `pgls_lsp::testing`, for tests that talk to the server in the same process.
testing = ["dep:tower"]

[dev-dependencies]
pgls_catalog           = { workspace = true }
pgls_lsp               = { workspace = true, features = ["testing"] }
pgls_plpgsql_check     = { workspace = true }
pgls_postgres_regress  = { workspace = true }
pgls_splinter          = { workspace = true }
pgls_test_utils        = { workspace = true }
pgls_typecheck         = { workspace = true }
proptest               = "1.12.0"
proptest-state-machine = "0.9.0"
sqlx                   = { workspace = true }
tempfile               = "3.15.0"
test-log               = { workspace = true }
tokio                  = { workspace = true, features = ["macros", "test-util"] }

[lib]
doctest = false

[lints]
workspace = true
