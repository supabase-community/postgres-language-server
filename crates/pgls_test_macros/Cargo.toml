
[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_test_macros"
repository.workspace = true
version              = "0.0.0"

[lib]
proc-macro = true

[dependencies]
globwalk         = { version = "0.9.1" }
proc-macro-error = { version = "1.0.4" }
proc-macro2      = { version = '1.0.93' }
quote            = { workspace = true }
syn              = { workspace = true }

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "allow" # a proc macro runs on our own code at build time
indexing_slicing                = "allow" # a proc macro runs on our own code at build time
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # a proc macro runs on our own code at build time
