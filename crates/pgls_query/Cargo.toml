[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_query"
repository.workspace = true
version              = "0.0.0"

[dependencies]
prost     = { workspace = true }
thiserror = { workspace = true }

pgls_query_macros = { workspace = true }


[features]
default = []

[build-dependencies]
bindgen     = "0.72.0"
cc          = "1.0.83"
glob        = "0.3.1"
prost-build = "0.13.5"

[dev-dependencies]
easy-parallel = "3.2.0"

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
