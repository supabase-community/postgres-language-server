[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_lexer"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_diagnostics.workspace   = true
pgls_lexer_codegen.workspace = true
pgls_text_size.workspace     = true
pgls_tokenizer.workspace     = true

pgls_query = { workspace = true, optional = true }

[dev-dependencies]
pgls_lexer = { workspace = true, features = ["testing"] }

[features]
# `Lexed::scanner_difference`, for tests that compare the lexer with Postgres' scanner.
testing = ["dep:pgls_query"]

[package.metadata.cargo-shear]
# The dev-dependency on itself only turns on `testing` for the unit tests.
ignored = ["pgls_lexer"]

[lints]
workspace = true
