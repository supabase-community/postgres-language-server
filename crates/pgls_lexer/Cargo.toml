[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_lexer"
repository.workspace = true
version              = "0.0.0"


[dependencies]
pgls_diagnostics.workspace   = true
pgls_lexer_codegen.workspace = true
pgls_text_size.workspace     = true
pgls_tokenizer.workspace     = true

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "warn"
indexing_slicing                = "warn"
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "warn"
