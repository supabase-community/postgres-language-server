# The real-world SQL of the corpus check (`tests/corpus.rs`).
#
# Each source is checked out at its pinned `rev` (a full SHA), with only the `.sql` and `.pg` files
# under its `paths`, and the CLI runs over these paths. Move a pin by editing `rev` and updating the
# source's snapshot. Postgres' own regression suite is covered by `pgls_postgres_regress`.

[[source]]
name  = "sqlfluff"
paths = ["test/fixtures/dialects/postgres"]
repo  = "https://github.com/sqlfluff/sqlfluff.git"
rev   = "63534d45a4abf5bf29934748d7039843e326bf0d"

[[source]]
name  = "supabase"
paths = ["supabase/migrations", "examples", "docker/volumes/db"]
repo  = "https://github.com/supabase/supabase.git"
rev   = "cf37022b6b0a6c5634431138b1c25b94f317b8eb"

[[source]]
name  = "supabase-postgres"
paths = ["migrations", "nix/tests/sql"]
repo  = "https://github.com/supabase/postgres.git"
rev   = "f0ae55d70b1f4a1a3085a3e002acc5fbb1e00d43"

[[source]]
name  = "libpg_query"
paths = ["test/sql/plpgsql_regress", "test/sql/deparse", "test/sql/deparse-depesz"]
repo  = "https://github.com/pganalyze/libpg_query.git"
rev   = "27112f8af5de70368319a12c346c2fb37cd74476"

# `pagila-data.sql` is a pg_dump of 13 MiB, mostly `COPY … FROM stdin` data rows.
[[source]]
name  = "pagila"
paths = ["pagila-data.sql", "pagila-schema.sql", "pagila-schema-jsonb.sql", "pagila-temporal-setup.sql", "pg_partman-setup.sql"]
repo  = "https://github.com/devrimgunduz/pagila.git"
rev   = "6ea53f812254c91a602f61c0ef62beca3fa676b1"

# GitLab's schema dump: one 3 MiB file with about 16,700 statements.
[[source]]
name  = "gitlab"
paths = ["db/structure.sql"]
repo  = "https://github.com/gitlabhq/gitlabhq.git"
rev   = "d7b9a6176ab4e279465ba3ee09922cde2b74de47"
