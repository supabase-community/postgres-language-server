[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_cli"
repository.workspace = true
version              = "0.0.0"


[dependencies]
anyhow                   = { workspace = true }
bpaf                     = { workspace = true, features = ["bright-color"] }
crossbeam                = { workspace = true }
dashmap                  = "5.5.3"
hdrhistogram             = { version = "7.5.4", default-features = false }
path-absolutize          = { version = "3.1.1", optional = false, features = ["use_unix_paths_on_wasm"] }
pgls_analyse             = { workspace = true }
pgls_catalog             = { workspace = true, features = ["db"] }
pgls_configuration       = { workspace = true }
pgls_console             = { workspace = true }
pgls_diagnostics         = { workspace = true }
pgls_env                 = { workspace = true }
pgls_fs                  = { workspace = true }
pgls_lexer               = { workspace = true }
pgls_lsp                 = { workspace = true }
pgls_migrations          = { workspace = true }
pgls_query               = { workspace = true }
pgls_text_edit           = { workspace = true }
pgls_workspace           = { workspace = true }
prost                    = { workspace = true }
quick-junit              = "0.5.0"
rayon                    = { workspace = true }
rustc-hash               = { workspace = true }
serde                    = { workspace = true, features = ["derive"] }
serde_json               = { workspace = true }
sqlx                     = { workspace = true }
tokio                    = { workspace = true, features = ["io-std", "io-util", "net", "time", "rt", "sync", "rt-multi-thread", "macros"] }
tracing                  = { workspace = true }
tracing-appender         = "0.2.3"
tracing-bunyan-formatter = { workspace = true }
tracing-subscriber       = { workspace = true, features = ["env-filter", "json"] }
tracing-tree             = { version = "0.4.0", features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc  = "0.2.161"
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1.43"

[target.'cfg(all(target_family="unix", not(all(target_arch = "aarch64", target_env = "musl"))))'.dependencies]
tikv-jemallocator = "0.6.0"

[dev-dependencies]
assert_cmd      = "2.1.2"
insta           = { workspace = true, features = ["yaml"] }
pgls_test_utils = { workspace = true }
sqlx            = { workspace = true }
tempfile        = "3.15.0"

[lib]
doctest = false

[[bin]]
name = "postgrestools"
path = "src/main.rs"

[[bin]]
name = "postgres-language-server"
path = "src/main.rs"

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "allow" # not clean yet
dbg_macro                       = "deny"
expect_used                     = "allow" # not clean yet
indexing_slicing                = "allow" # not clean yet
self_named_module_files         = "allow" # not clean yet
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # not clean yet
