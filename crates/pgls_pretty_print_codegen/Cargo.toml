[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "pgls_pretty_print_codegen"
repository.workspace = true
version              = "0.0.0"

[dependencies]
anyhow                = { workspace = true }
convert_case          = { workspace = true }
proc-macro2.workspace = true
prost-reflect         = { workspace = true }
protox                = { workspace = true }
quote.workspace       = true

[build-dependencies]
ureq = "2.9"

[lib]
proc-macro = true

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "allow" # not clean yet

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
expect_used                     = "allow" # a proc macro runs on our own code at build time
indexing_slicing                = "allow" # a proc macro runs on our own code at build time
self_named_module_files         = "warn"
todo                            = "deny"
unimplemented                   = "deny"
unwrap_used                     = "allow" # a proc macro runs on our own code at build time
