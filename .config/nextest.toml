# The profile of `cargo nextest run --profile ci`. nextest runs the tests of all binaries in one
# pool, where `cargo test` runs one binary after another.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
# Report a test that runs longer than a minute, and stop it after ten.
slow-timeout = { period = "60s", terminate-after = 10 }

# `corpus` and `corpus_sources` check out the same sources. The lock in the test binary keeps them
# apart only within one process, and nextest runs each test in a process of its own.
[test-groups]
corpus = { max-threads = 1 }

[[profile.ci.overrides]]
filter     = 'binary(corpus)'
test-group = 'corpus'
