<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGLS Monaco E2E Test</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #container {
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 8px 16px;
        background: #333;
        color: #fff;
        font-family: monospace;
        font-size: 12px;
        border-radius: 4px;
        z-index: 1000;
      }
      #status.ready {
        background: #28a745;
      }
      #status.error {
        background: #dc3545;
      }
      #diagnostics {
        position: fixed;
        bottom: 10px;
        left: 10px;
        right: 10px;
        max-height: 150px;
        overflow: auto;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: monospace;
        font-size: 12px;
        padding: 10px;
        border-radius: 4px;
        z-index: 1000;
      }
      .diagnostic-error {
        color: #f48771;
      }
      .diagnostic-warning {
        color: #cca700;
      }
      .diagnostic-info {
        color: #75beff;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="status">Loading...</div>
    <div id="diagnostics" data-testid="diagnostics"></div>

    <!-- Monaco Editor from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

    <script type="module">
      // Status element
      const statusEl = document.getElementById("status");
      const diagnosticsEl = document.getElementById("diagnostics");

      function setStatus(text, className = "") {
        statusEl.textContent = text;
        statusEl.className = className;
      }

      function showDiagnostics(diagnostics) {
        diagnosticsEl.innerHTML =
          diagnostics.length === 0
            ? "<div>No diagnostics</div>"
            : diagnostics
                .map((d) => {
                  const className = `diagnostic-${d.severity || "info"}`;
                  return `<div class="${className}">[${d.severity}] ${d.message}</div>`;
                })
                .join("");
      }

      /**
       * LSP Worker Client - Wraps the Language Server running in a Web Worker.
       *
       * This is how you would integrate PGLS with Monaco in production:
       * 1. Create the worker with the LSP module
       * 2. Send LSP messages via postMessage
       * 3. Receive responses and notifications
       */
      class LspWorkerClient {
        constructor() {
          this.worker = null;
          this.pendingRequests = new Map();
          this.requestId = 0;
          this.handlers = new Map();
        }

        async init() {
          return new Promise((resolve, reject) => {
            this.worker = new Worker("/e2e/lsp-worker.js", { type: "module" });

            this.worker.onmessage = (event) => {
              const { type, response, message, requestId } = event.data;

              if (type === "ready") {
                resolve();
              } else if (type === "error" && !this.pendingRequests.has(requestId)) {
                reject(new Error(message));
              } else if (type === "response") {
                // Handle notifications (no id)
                if (response.method) {
                  const handler = this.handlers.get(response.method);
                  if (handler) {
                    handler(response.params);
                  }
                }

                // Resolve pending request
                if (requestId !== undefined && this.pendingRequests.has(requestId)) {
                  const { resolve, responses } = this.pendingRequests.get(requestId);
                  responses.push(response);
                  // For requests, resolve immediately with all responses
                  // For notifications, we collect all responses
                  if (response.id !== undefined || response.method) {
                    resolve(responses);
                    this.pendingRequests.delete(requestId);
                  }
                }
              } else if (type === "error") {
                const pending = this.pendingRequests.get(requestId);
                if (pending) {
                  pending.reject(new Error(message));
                  this.pendingRequests.delete(requestId);
                }
              }
            };

            this.worker.postMessage({ type: "init" });
          });
        }

        // Send message and collect responses
        sendMessage(message) {
          return new Promise((resolve, reject) => {
            const id = ++this.requestId;
            this.pendingRequests.set(id, { resolve, reject, responses: [] });
            this.worker.postMessage({ type: "message", message, id });

            // A notification may have no response, so it resolves with what it got after a
            // while. A request waits for its response, which takes longer on a busy machine.
            if (message.id !== undefined) {
              return;
            }
            setTimeout(() => {
              const pending = this.pendingRequests.get(id);
              if (pending) {
                resolve(pending.responses);
                this.pendingRequests.delete(id);
              }
            }, 500);
          });
        }

        // Register handler for notifications
        onNotification(method, handler) {
          this.handlers.set(method, handler);
        }
      }

      // Load Monaco
      require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" } });

      require(["vs/editor/editor.main"], async function () {
        setStatus("Monaco loaded, loading WASM...");

        // Register SQL language
        monaco.languages.register({ id: "sql" });

        // Create editor
        const editor = monaco.editor.create(document.getElementById("container"), {
          value: "-- Type SQL here\nSELECT * FROM users;",
          language: "sql",
          theme: "vs-dark",
          automaticLayout: true,
          minimap: { enabled: false },
        });

        // Expose editor for tests
        window.monacoEditor = editor;

        try {
          // Create worker-based LSP client for Monaco integration
          const lspClient = new LspWorkerClient();
          await lspClient.init();
          window.pglsLspClient = lspClient;

          // Initialize LSP via worker
          await lspClient.sendMessage({
            jsonrpc: "2.0",
            id: 1,
            method: "initialize",
            params: { capabilities: {} },
          });

          // Set up diagnostics on content change using the worker LSP
          const uri = "file:///test.sql";
          let debounceTimer;
          let documentVersion = 0;
          let requestId = 1000;

          // Code actions: Monaco asks for them for the lightbulb, the quick fix menu and
          // "Fix All", and applies the edits of the one the user picks.
          const toLspRange = (range) => ({
            start: { line: range.startLineNumber - 1, character: range.startColumn - 1 },
            end: { line: range.endLineNumber - 1, character: range.endColumn - 1 },
          });
          monaco.languages.registerCodeActionProvider(
            "sql",
            {
              async provideCodeActions(model, range, context) {
                const id = ++requestId;
                const messages = await lspClient.sendMessage({
                  jsonrpc: "2.0",
                  id,
                  method: "textDocument/codeAction",
                  params: {
                    textDocument: { uri },
                    range: toLspRange(range),
                    context: {
                      diagnostics: context.markers.map((marker) => ({
                        range: toLspRange(marker),
                        message: marker.message,
                        code: marker.code,
                        source: marker.source,
                      })),
                      only: context.only ? [context.only] : undefined,
                    },
                  },
                });
                const actions = messages.find((m) => m.id === id)?.result ?? [];
                return {
                  actions: actions.map((action) => ({
                    title: action.title,
                    kind: action.kind,
                    isPreferred: action.isPreferred,
                    edit: {
                      edits: (action.edit?.changes?.[uri] ?? []).map((edit) => ({
                        resource: model.uri,
                        versionId: undefined,
                        textEdit: {
                          range: {
                            startLineNumber: edit.range.start.line + 1,
                            startColumn: edit.range.start.character + 1,
                            endLineNumber: edit.range.end.line + 1,
                            endColumn: edit.range.end.character + 1,
                          },
                          text: edit.newText,
                        },
                      })),
                    },
                  })),
                  dispose() {},
                };
              },
            },
            { providedCodeActionKinds: ["quickfix", "source.fixAll.pgls"] },
          );

          setStatus("Ready", "ready");

          const updateDiagnostics = async () => {
            const content = editor.getValue();
            documentVersion++;

            // Send didOpen/didChange via LSP worker
            const messages = await lspClient.sendMessage({
              jsonrpc: "2.0",
              method: documentVersion === 1 ? "textDocument/didOpen" : "textDocument/didChange",
              params:
                documentVersion === 1
                  ? {
                      textDocument: {
                        uri: uri,
                        languageId: "sql",
                        version: documentVersion,
                        text: content,
                      },
                    }
                  : {
                      textDocument: {
                        uri: uri,
                        version: documentVersion,
                      },
                      contentChanges: [{ text: content }],
                    },
            });

            // Find publishDiagnostics notification
            const diagNotification = messages.find(
              (m) => m.method === "textDocument/publishDiagnostics",
            );
            const diagnostics = diagNotification?.params?.diagnostics || [];

            // Update Monaco markers
            const model = editor.getModel();
            const markers = diagnostics.map((d) => ({
              severity:
                d.severity === 1
                  ? monaco.MarkerSeverity.Error
                  : d.severity === 2
                    ? monaco.MarkerSeverity.Warning
                    : monaco.MarkerSeverity.Info,
              message: d.message,
              code: d.code,
              source: d.source,
              startLineNumber: d.range.start.line + 1,
              startColumn: d.range.start.character + 1,
              endLineNumber: d.range.end.line + 1,
              endColumn: d.range.end.character + 1,
            }));

            monaco.editor.setModelMarkers(model, "pgls", markers);

            // Show in diagnostics panel
            showDiagnostics(
              diagnostics.map((d) => ({
                severity: d.severity === 1 ? "error" : d.severity === 2 ? "warning" : "info",
                message: d.message,
              })),
            );

            // Expose diagnostics for tests
            window.lastDiagnostics = diagnostics;
          };

          editor.onDidChangeModelContent(() => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updateDiagnostics, 300);
          });

          // Initial diagnostics
          updateDiagnostics();
        } catch (err) {
          console.error("Failed to load WASM:", err);
          setStatus("Error: " + err.message, "error");
          window.pglsError = err;
        }
      });
    </script>
  </body>
</html>
