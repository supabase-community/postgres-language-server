
[package]
authors.workspace    = true
categories.workspace = true
description          = "<DESCRIPTION>"
edition.workspace    = true
homepage.workspace   = true
keywords.workspace   = true
license.workspace    = true
name                 = "docs_codegen"
repository.workspace = true
version              = "0.0.0"

[dependencies]
regex              = { workspace = true }
anyhow                     = { workspace = true }
bpaf                     = { workspace = true, features = ["docgen"] }
schemars       = { workspace = true }
serde_json       = { workspace = true }
pulldown-cmark          = "0.12.2"

pgls_configuration = { workspace = true, features = ["schema"] }
pgls_env = { workspace = true }
pgls_cli = { workspace = true }
pgls_analyse = { workspace = true }
pgls_analyser = { workspace = true }
pgls_catalog = { workspace = true }
pgls_postgres_regress = { workspace = true }
pgls_splinter = { workspace = true }
pgls_diagnostics = { workspace = true }
pgls_query = { workspace = true }
pgls_query_ext = { workspace = true }
pgls_workspace = { workspace = true }
pgls_statement_splitter = { workspace = true }
pgls_console = { workspace = true }
convert_case = { workspace = true }

# The workspace lints of the root `Cargo.toml`, with the ones this crate isn't clean for
# allowed. Switch back to `lints.workspace = true` once it is.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "allow" # a developer tool, which may fail on unexpected input
indexing_slicing = "allow" # a developer tool, which may fail on unexpected input
self_named_module_files = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "allow" # a developer tool, which may fail on unexpected input

[package.metadata.cargo-shear]
# Only enables bpaf's `docgen` feature for `pgls_cli`'s parser, which renders the CLI reference.
ignored = ["bpaf"]
