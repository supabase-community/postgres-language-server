# The fuzz targets, run with `just fuzz <target>`. A workspace of their own, outside the `crates/*`
# glob, so `cargo test --workspace` doesn't build libFuzzer.
[package]
edition = "2024"
name    = "pgls_fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary               = { version = "1", features = ["derive"] }
futures                 = "0.3.31"
libfuzzer-sys           = "0.4"
pgls_configuration      = { path = "../crates/pgls_configuration" }
pgls_fs                 = { path = "../crates/pgls_fs" }
pgls_lsp                = { path = "../crates/pgls_lsp", features = ["testing"] }
pgls_wasm               = { path = "../crates/pgls_wasm" }
pgls_workspace          = { path = "../crates/pgls_workspace" }
serde_json              = "1"
tokio                   = { version = "1", features = ["rt-multi-thread", "time"] }
pgls_lexer              = { path = "../crates/pgls_lexer" }
pgls_pretty_print       = { path = "../crates/pgls_pretty_print" }
pgls_query              = { path = "../crates/pgls_query" }
pgls_statement_splitter = { path = "../crates/pgls_statement_splitter" }
pgls_text_size          = { path = "../crates/pgls_text_size" }

[dev-dependencies]
pgls_postgres_regress = { path = "../crates/pgls_postgres_regress" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
bench = false
doc   = false
name  = "splitter"
path  = "fuzz_targets/splitter.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "splitter_vs_parser"
path  = "fuzz_targets/splitter_vs_parser.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "formatter_roundtrip"
path  = "fuzz_targets/formatter_roundtrip.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "lexer_vs_scan"
path  = "fuzz_targets/lexer_vs_scan.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "lsp_messages"
path  = "fuzz_targets/lsp_messages.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "wasm_session"
path  = "fuzz_targets/wasm_session.rs"
test  = false
