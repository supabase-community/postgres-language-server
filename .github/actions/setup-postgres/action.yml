name: Setup Postgres
description: Setup Postgres across operating systems
inputs:
  postgres-version:
    description: Postgres Version
    default: 15

runs:
  using: composite
  steps:
    # macOS runners have no Docker. The extensions aren't installed: the tests that need them run
    # on Linux only.
    - name: Setup postgres (macOS)
      if: runner.os == 'macOS'
      uses: ikalnytskyi/action-setup-postgres@v7
      with:
        postgres-version: ${{ inputs.postgres-version }}
        username: postgres
        password: postgres
        database: postgres
        port: 5432

    # Windows has no Linux containers either. EnterpriseDB's binaries, kept in the Actions cache:
    # the action above installs them with Chocolatey, whose feed often answers 504.
    - name: Restore Postgres binaries (Windows)
      if: runner.os == 'Windows'
      id: postgres-binaries
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/pgsql
        key: postgres-windows-x64-15.20-1

    - name: Download Postgres binaries (Windows)
      if: runner.os == 'Windows' && steps.postgres-binaries.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pgsql.zip" \
          https://get.enterprisedb.com/postgresql/postgresql-15.20-1-windows-x64-binaries.zip
        7z x -bso0 -o"$RUNNER_TEMP" "$RUNNER_TEMP/pgsql.zip"
        # Only the server and the command-line tools.
        rm -rf "$RUNNER_TEMP/pgsql.zip" "$RUNNER_TEMP/pgsql/pgAdmin 4" "$RUNNER_TEMP/pgsql/StackBuilder" \
          "$RUNNER_TEMP/pgsql/doc" "$RUNNER_TEMP/pgsql/symbols"

    # The same cluster as the action above creates on macOS.
    - name: Start Postgres (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # The runner sets these for its own, older PostgreSQL.
        for name in PGROOT PGDATA PGBIN PGUSER PGPASSWORD; do
          echo "$name=" >> "$GITHUB_ENV"
        done
        echo "$RUNNER_TEMP/pgsql/bin" >> "$GITHUB_PATH"
        PATH="$(cygpath -u "$RUNNER_TEMP/pgsql/bin"):$PATH"
        echo postgres > "$RUNNER_TEMP/pwfile"
        initdb --pgdata="$RUNNER_TEMP/pgdata" --username=postgres --pwfile="$RUNNER_TEMP/pwfile" \
          --auth=scram-sha-256 --encoding=UTF-8 --locale=en_US.UTF-8 --no-instructions
        echo "port = 5432" >> "$RUNNER_TEMP/pgdata/postgresql.conf"
        pg_ctl start --pgdata="$RUNNER_TEMP/pgdata" --log="$RUNNER_TEMP/postgres.log" --wait

    # For Linux, use custom Docker image with plpgsql_check and pglinter
    - name: Set up Docker Buildx
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v3

    - name: Build PostgreSQL image with cache
      if: runner.os == 'Linux'
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: postgres-language-server-dev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Start PostgreSQL container
      if: runner.os == 'Linux'
      shell: bash
      run: |
        docker run -d --name postgres \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=postgres \
          -p 5432:5432 \
          postgres-language-server-dev:latest
        # Wait for the image's init scripts to finish before checking readiness;
        # pg_isready can briefly catch Docker's temporary bootstrap server.
        for _ in {1..60}; do
          if docker logs postgres 2>&1 | grep -Eq "PostgreSQL init process complete|Skipping initialization"; then
            break
          fi
          sleep 1
        done

        for _ in {1..60}; do
          if docker exec postgres psql -U postgres -d postgres -tAc "SELECT 1" >/dev/null; then
            break
          fi
          sleep 1
        done

        # Create extensions in postgres database only (NOT template1)
        # This avoids polluting test databases - tests that need extensions can create them explicitly
        echo "Creating extensions in postgres database..."
        docker exec postgres psql -U postgres -c "CREATE SCHEMA IF NOT EXISTS extensions;"
        docker exec postgres psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS plpgsql_check SCHEMA extensions;"
        docker exec postgres psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS pglinter SCHEMA extensions;"

        # Show extension status
        docker exec postgres psql -U postgres -c "SELECT extname, extversion FROM pg_extension WHERE extname IN ('plpgsql_check', 'pglinter');"
