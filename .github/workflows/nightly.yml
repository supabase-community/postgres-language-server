name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # A change to this file runs it, with short fuzz runs.
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"

env:
  RUST_BACKTRACE: 1

jobs:
  # Fetches the corpus test's sources (crates/pgls_cli/tests/corpus.toml) for the fuzz jobs' seeds,
  # and keeps them in the Actions cache until a pin moves. Building the test takes a while, so it
  # runs only when the cache misses.
  corpus-sources:
    name: Corpus Sources
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: cache
        uses: actions/cache@v5
        with:
          path: target/tmp/corpus
          key: corpus-sources-${{ hashFiles('crates/pgls_cli/tests/corpus.toml') }}
      - name: Free Disk Space
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/free-disk-space
      - name: Install toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: moonrepo/setup-rust@v1
        with:
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup tree-sitter
        if: steps.cache.outputs.cache-hit != 'true'
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9
      - name: Fetch the sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test -p pgls_cli --test corpus -- --ignored --exact corpus_sources

  # Runs each target of fuzz/ for 10 minutes with debug assertions, seeded from the regression SQL
  # and the corpus sources, and with AddressSanitizer in libpg_query and the tree-sitter grammar
  # (fuzz/asan-cc). The corpus a run finds is kept in the Actions cache for the next one; a crash
  # fails the job and is uploaded as an artifact.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: corpus-sources
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [splitter_vs_parser, formatter_roundtrip, lexer_vs_scan, lsp_messages]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Setup tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9
      - name: Setup Just
        uses: extractions/setup-just@v3
      - uses: actions/cache@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Restore the corpus sources
        uses: actions/cache/restore@v5
        with:
          path: target/tmp/corpus
          key: corpus-sources-${{ hashFiles('crates/pgls_cli/tests/corpus.toml') }}
      - name: Fuzz
        run: just fuzz ${{ matrix.target }} ${{ github.event_name == 'pull_request' && 60 || 600 }}
        env:
          CC: ${{ github.workspace }}/fuzz/asan-cc
          RUSTFLAGS: -Clinker=clang -Clink-arg=-fsanitize=address
      - name: Upload the crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
