name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # A change to this file runs it, with short fuzz runs.
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"

env:
  RUST_BACKTRACE: 1

jobs:
  # Runs each target of fuzz/ for 10 minutes with debug assertions, and with AddressSanitizer in
  # the C code: libpg_query and the tree-sitter grammar's scanner. The Rust code isn't instrumented:
  # that needs `-Zsanitizer`, and `rustix` 0.37, which sqlx's async-std runtime pulls in, doesn't
  # build with nightly features. The corpus a run finds is kept in the Actions cache for the next
  # one; a crash fails the job and is uploaded as an artifact.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - splitter
          - splitter_vs_parser
          - formatter_roundtrip
          - lexer_vs_scan
          - lsp_messages
          - wasm_session
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/tree-sitter
            target/**/build/pgls_treesitter_grammar-*/out/generated
          key: ${{ runner.os }}-tree-sitter-${{ hashFiles('.tree-sitter-cli-version', 'crates/pgls_treesitter_grammar/grammar.js', 'crates/pgls_treesitter_grammar/tree-sitter.json', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: Setup tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9
      - name: Setup Just
        uses: extractions/setup-just@v3
      - uses: actions/cache@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: just fuzz ${{ matrix.target }} ${{ github.event_name == 'pull_request' && 60 || 600 }}
        env:
          CC: ${{ github.workspace }}/fuzz/asan-cc
          RUSTFLAGS: -Clinker=clang -Clink-arg=-fsanitize=address
      - name: Upload the crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
