name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "lib/**"
      - "fuzz/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".env"
      - "packages/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".sqlx/**"
      - ".cargo/**"
      - ".config/**"
      - "clippy.toml"
      - "taplo.toml"
      - ".tree-sitter-cli-version"
      - "postgres-language-server.jsonc"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - ".npmrc"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "justfile"
      - "flake.nix"
      - "flake.lock"
      - "docker-compose.yml"
      - "test-db/**"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_LOG: info
  RUST_BACKTRACE: 1
  RUSTUP_WINDOWS_PATH_ADD_BIN: 1

jobs:
  # Docs-only changes skip the build and test jobs, but still run the checks that cover docs:
  # formatting, codegen (which generates parts of the docs) and the docs build.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      formatter: ${{ github.event_name != 'pull_request' || steps.filter.outputs.formatter == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - "crates/**"
              - "lib/**"
              - "fuzz/**"
              - "xtask/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Dockerfile"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - ".env"
              - "packages/**"
              - ".github/workflows/**"
              - ".github/actions/**"
              - ".sqlx/**"
              - ".cargo/**"
              - ".config/**"
              - "clippy.toml"
              - "taplo.toml"
              - ".tree-sitter-cli-version"
              - "postgres-language-server.jsonc"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "tsconfig.json"
              - ".npmrc"
              - ".oxlintrc.json"
              - ".oxfmtrc.json"
              - "justfile"
              - "flake.nix"
              - "flake.lock"
              - "docker-compose.yml"
              - "test-db/**"
            docs:
              - "docs/**"
              - "mkdocs.yml"
              - "pyproject.toml"
              - "uv.lock"
              - "README.md"
            formatter:
              - "crates/pgls_pretty_print/**"
              - "crates/pgls_pretty_print_codegen/**"
              - "crates/pgls_query/**"
              - "crates/pgls_postgres_regress/**"
              - "Cargo.lock"
              - ".github/workflows/pull_request.yml"

  format:
    name: Format
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          components: rustfmt
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release binary, because building taplo-cli without its lockfile picks up
      # dependencies that need a newer Rust than our toolchain.
      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            | gunzip > "$HOME/.cargo/bin/taplo"
          chmod +x "$HOME/.cargo/bin/taplo"
          taplo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install JS dependencies
        run: bun install

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Echo Tool Versions
        run: |
          just format-ci-versions

      - name: Run format
        run: |
          just format-ci

  actionlint:
    name: Lint GitHub Actions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  unused-dependencies:
    name: Unused Dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
      - name: Install cargo-shear
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      # A dependency that only enables a feature, or isn't used yet, is listed under
      # `[package.metadata.cargo-shear]` in its crate's Cargo.toml, with the reason.
      - name: Check for unused dependencies
        run: cargo shear --deny-warnings

  lint:
    name: Lint Project
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          components: clippy
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One cache per kind of build, written by the runs on main and restored by pull requests.
      # Swatinem keys it on the lockfile and the toolchain, so it follows main.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # we need to use the same database as we do locally for sqlx prepare to output the same hashes
      - name: Setup Postgres
        uses: ./.github/actions/setup-postgres

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/tree-sitter
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
            target/**/build/pgls_treesitter_grammar-*/out/generated
          key: ${{ runner.os }}-tree-sitter-${{ hashFiles('.tree-sitter-cli-version', 'crates/pgls_treesitter_grammar/grammar.js', 'crates/pgls_treesitter_grammar/tree-sitter.json', 'rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9

      - name: Setup sqlx-cli
        run: command -v sqlx || cargo install sqlx-cli --version 0.8.6 --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install JS dependencies
        run: bun install

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Echo Tool Versions
        run: |
          just lint-ci-versions

      - name: Run Lints
        run: |
          just lint-ci

      - name: Lint other feature sets
        run: just lint-features

      - name: Check for changes
        run: |
          if [[ $(git status --porcelain) ]]; then
            git status
            git diff
            exit 1
          fi

  # Formats the fixtures and the Postgres regression suite under 32 combinations of the formatter
  # options. Too slow for the debug test run on every platform, so it runs once, in release, when
  # the formatter or the parser changes.
  formatter-option-matrix:
    name: Formatter Option Matrix
    needs: changes
    if: needs.changes.outputs.formatter == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: formatter-option-matrix
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the option matrix
        run: cargo test -p pgls_pretty_print --release --test option_matrix -- --ignored

  # Builds the release binary and the release tests of the corpus check and the completion harness
  # once, for "Corpus" and "Test JS Packages". In release, because `format` of GitLab's schema takes
  # minutes in debug.
  build-release:
    name: Build Release
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/tree-sitter
            target/**/build/pgls_treesitter_grammar-*/out/generated
          key: ${{ runner.os }}-tree-sitter-${{ hashFiles('.tree-sitter-cli-version', 'crates/pgls_treesitter_grammar/grammar.js', 'crates/pgls_treesitter_grammar/tree-sitter.json', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: Setup tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The archive holds the test binaries and the CLI binary that the corpus check runs.
      - name: Build
        run: |
          cargo nextest archive --cargo-profile release -p pgls_cli -p pgls_completions \
            --test corpus --test harness --archive-file release-tests.tar.zst
      - name: Upload the tests
        uses: actions/upload-artifact@v4
        with:
          name: release-tests
          path: release-tests.tar.zst
          retention-days: 1
      - name: Upload the CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: target/release/postgres-language-server
          retention-days: 1

  # The fuzz targets are a workspace of their own (fuzz/), so the other jobs don't build them. Nightly
  # runs them (nightly.yml); here they only have to build and pass clippy.
  fuzz-targets:
    name: Fuzz Targets
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          components: clippy
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # fuzz/ has no lockfile of its own: the root one pins the dependencies they share.
      - name: Use the root lockfile
        run: cp Cargo.lock fuzz/Cargo.lock
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-targets
          workspaces: fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/tree-sitter
            target/**/build/pgls_treesitter_grammar-*/out/generated
          key: ${{ runner.os }}-tree-sitter-${{ hashFiles('.tree-sitter-cli-version', 'crates/pgls_treesitter_grammar/grammar.js', 'crates/pgls_treesitter_grammar/tree-sitter.json', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: Setup tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9
      - name: Run clippy
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  # Runs the CLI and the fuzzers' oracles over real-world SQL (crates/pgls_cli/tests/corpus.toml)
  # and compares a summary per source with its snapshot.
  # Also runs the completion harness over the Postgres regression SQL
  # (crates/pgls_completions/tests/harness.rs), which takes minutes in debug too.
  corpus:
    name: Corpus
    needs: [changes, build-release]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Download the tests
        uses: actions/download-artifact@v4
        with:
          name: release-tests
      - name: Run the corpus check and the completion harness
        run: |
          cargo-nextest nextest run --archive-file release-tests.tar.zst --workspace-remap . \
            --profile ci --run-ignored only

  # Linux runs the tests against every supported major of Postgres; the other platforms against 15.
  test:
    name: Test (${{ matrix.os }}${{ matrix.postgres != 15 && format(', Postgres {0}', matrix.postgres) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform or major doesn't cancel the others, so it shows where it fails.
      fail-fast: false
      matrix:
        include:
          # use the same images we use for compiling
          - os: windows-2022
            postgres: 15
          - os: ubuntu-22.04
            postgres: 15
          - os: ubuntu-22.04
            postgres: 16
          - os: ubuntu-22.04
            postgres: 17
          - os: ubuntu-22.04
            postgres: 18
          - os: macos-15
            postgres: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          components: clippy
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.postgres == 15 }}

      - name: Setup Postgres
        uses: ./.github/actions/setup-postgres
        with:
          postgres-version: ${{ matrix.postgres }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/tree-sitter
            target/**/build/pgls_treesitter_grammar-*/out/generated
          key: ${{ runner.os }}-tree-sitter-${{ hashFiles('.tree-sitter-cli-version', 'crates/pgls_treesitter_grammar/grammar.js', 'crates/pgls_treesitter_grammar/tree-sitter.json', 'rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9

      # Linux code is linted in "Lint Project".
      - name: Run clippy
        if: runner.os != 'Linux'
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      # nextest doesn't run doctests. `cargo test --doc` ignores `doctest = false`, so only the
      # packages that keep their doctests on.
      - name: Run doctests
        if: matrix.postgres == 15
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(any(.targets[]; .doctest)) | "-p", .name' \
            | tr -d '\r' | xargs cargo test --doc

  # Tests the binary that "Build Release" built.
  test-js-bindings:
    needs: [changes, build-release]
    if: needs.changes.outputs.code == 'true'
    name:
      Test JS Packages
      # use the same image we use for compiling
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Download the CLI binary
        uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: target/release
      - name: Make the CLI binary executable
        run: chmod +x target/release/postgres-language-server
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install JS dependencies
        run: bun install

      - name: Build backend-jsonrpc
        working-directory: packages/@postgres-language-server/backend-jsonrpc
        run: bun run build
      - name: Run backend-jsonrpc test
        working-directory: packages/@postgres-language-server/backend-jsonrpc
        run: bun run test
      - name: Run cli test
        working-directory: packages/@postgres-language-server/cli
        env:
          PGLS_BINARY: ${{ github.workspace }}/target/release/postgres-language-server
        run: bun run test

  test-wasm:
    name: Test WASM Package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # The toolchain is the dev shell's, so the cache asks it for cargo and rustc.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          cmd-format: nix develop --command {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JS dependencies
        run: nix develop --command bun install

      # Without regenerating the schema types first, as `bun run build` does: "Check Codegen"
      # checks that the committed ones are current.
      - name: Build WASM package
        run: nix develop --command bash -c "cd packages/@postgres-language-server/wasm && bun run build:wasm && bun run build:ts:release-assets"

      - name: Run WASM unit tests
        run: nix develop --command bash -c "cd packages/@postgres-language-server/wasm && bun test"

      - name: Install Playwright
        run: nix develop --command bash -c "cd packages/@postgres-language-server/wasm && bun run test:e2e:install"

      - name: Run WASM e2e tests
        run: nix develop --command bash -c "cd packages/@postgres-language-server/wasm && bun run test:e2e"

  codegen:
    name: Check Codegen
    needs: changes
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          components: rustfmt
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: codegen
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The release binary, because building taplo-cli without its lockfile picks up
      # dependencies that need a newer Rust than our toolchain.
      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            | gunzip > "$HOME/.cargo/bin/taplo"
          chmod +x "$HOME/.cargo/bin/taplo"
          taplo --version
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/tree-sitter
            target/**/build/pgls_treesitter_grammar-*/out/generated
          key: ${{ runner.os }}-tree-sitter-${{ hashFiles('.tree-sitter-cli-version', 'crates/pgls_treesitter_grammar/grammar.js', 'crates/pgls_treesitter_grammar/tree-sitter.json', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: Setup tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.9
      - name: Ensure RustFMT on nightly toolchain
        run: rustup component add rustfmt --toolchain nightly
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install JS dependencies
        run: bun install
      - name: Setup Just
        uses: extractions/setup-just@v3
      - name: Run codegen
        run: just gen-lint
      - name: Check for git diff -- run "just ready" if you see an error
        run: |
          if [[ $(git status --porcelain) ]]; then
            git status
            git diff
            exit 1
          fi

  docs:
    name: Build Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install the project
        run: uv sync --all-extras --dev
      # Strict mode fails on broken links and other warnings.
      - name: Build the docs
        run: uv run zensical build --strict
