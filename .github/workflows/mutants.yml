name: Mutants

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  # A change to this file or to the configuration runs it.
  pull_request:
    paths:
      - ".github/workflows/mutants.yml"
      - ".cargo/mutants.toml"

env:
  RUST_BACKTRACE: 1

jobs:
  # Mutation testing of the small crates with precise contracts that others rely on: cargo-mutants
  # changes the code, one mutant at a time, and reports the mutants the crate's own tests don't
  # catch. Report only: the job fails if the tests don't pass on the unchanged code, not on missed
  # mutants, which the summary and the artifact list.
  mutants:
    name: Mutants ${{ matrix.package }}
    # The prebuilt cargo-mutants needs glibc 2.39.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - pgls_line_index
          - pgls_text_size
          - pgls_text_edit
          - pgls_suppressions
          - pgls_lexer
          - pgls_tokenizer
          - pgls_matcher
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space
      - name: Install toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants
        run: |
          # A mutant that loops while it allocates would take the runner's memory before its
          # timeout; with a limit, it aborts and counts as caught.
          ulimit -v 2097152
          # 2 and 3 mean missed mutants and timeouts, which the summary reports.
          code=0
          cargo mutants -p ${{ matrix.package }} || code=$?
          {
            echo "### ${{ matrix.package }}"
            echo '```'
            cat mutants.out/missed.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || [ "$code" -eq 3 ]
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.package }}
          path: mutants.out
